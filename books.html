<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books (JSON + fetch)</title>
</head>
<body>
  <h1>Books</h1>
  <p id="error" role="alert"></p>

  <h2>(a) Title of the first book</h2>
  <p id="firstTitle"></p>

  <h2>(b) Author of the second book</h2>
  <p id="secondAuthor"></p>

  <h2>(c) Genres by book</h2>
  <ul id="genreList"></ul>

  <script>
    async function loadBooks() {
      const errorEl = document.getElementById("error");
      try {
        const response = await fetch("books.json");
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const data = await response.json();
        const books = data.books;

        document.getElementById("firstTitle").textContent = books[0].title;
        document.getElementById("secondAuthor").textContent = books[1].author;

        const list = document.getElementById("genreList");
        books.forEach(function (book) {
          const li = document.createElement("li");
          li.textContent = book.title + " \u2014 " + book.genres.join(", ");
          list.appendChild(li);
        });
      } catch (err) {
        errorEl.textContent =
          "Sorry, the book data could not be loaded. Please try again later.";
        console.error(err);
      }
    }

    loadBooks();
  </script>
</body>
</html>
